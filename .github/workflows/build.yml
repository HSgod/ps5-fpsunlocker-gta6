name: Build PS5 Payload

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang/LLVM 18 & PS5 Payload SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18 llvm-18-dev make wget unzip
          wget -q -O /tmp/sdk.zip https://github.com/ps5-payload-dev/sdk/releases/download/v0.43/ps5-payload-sdk.zip
          sudo unzip -q -d /opt /tmp/sdk.zip

      - name: Build ELF payload
        env:
          LLVM_CONFIG: /usr/bin/llvm-config-18
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
        run: |
          cd src
          make

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTAVI-UnlockFPS-Payload
          path: src/*.elf

      - name: Publish raw ELF to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(sed -n 's/^#define TOOL_VERSION "\(.*\)"/\1/p' src/gtavi-unlockfps.c)
          if gh release view latest >/dev/null 2>&1; then
            for asset in $(gh release view latest --json assets -q '.assets[].name'); do
              gh release delete-asset latest "$asset" --yes || true
            done
            gh release edit latest --title "GTAVI Unlock FPS v${VER}" --notes "Automated PS5 payload build from commit ${GITHUB_SHA::7}."
            gh release upload latest src/*.elf --clobber
          else
            gh release create latest src/*.elf --title "GTAVI Unlock FPS v${VER}" --notes "Automated PS5 payload build from commit ${GITHUB_SHA::7}."
          fi

name: Build PS5 Payload

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'SETTINGS.md'
      - 'repo.json'
      - 'icons.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang/LLVM 18 & PS5 Payload SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18 llvm-18-dev make wget unzip
          wget -q -O /tmp/sdk.zip https://github.com/ps5-payload-dev/sdk/releases/download/v0.43/ps5-payload-sdk.zip
          sudo unzip -q -d /opt /tmp/sdk.zip

      - name: Run host unit tests
        run: |
          clang-18 -DHOST_TEST -Wall -Wextra -Werror -Os src/test_resolution.c -o /tmp/test_resolution
          /tmp/test_resolution

      - name: Build ELF payload
        env:
          LLVM_CONFIG: /usr/bin/llvm-config-18
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
        run: |
          cd src
          make

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTAVI-UnlockFPS-Payload
          path: src/*.elf

      - name: Publish raw ELF to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(sed -n 's/^#define TOOL_VERSION "\(.*\)"/\1/p' src/gtavi-unlockfps.c)
          TAG="v${VER}"
          SUBJ=$(git log -1 --pretty=%s)
          NOTES=$(git log -1 --pretty=%b)
          if [ -z "$NOTES" ]; then
            NOTES="$SUBJ"
          fi
          REL_FLAG="--latest"
          if echo "$SUBJ" | grep -qi '\[prerelease\]'; then
            REL_FLAG="--prerelease"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            for asset in $(gh release view "$TAG" --json assets -q '.assets[].name'); do
              gh release delete-asset "$TAG" "$asset" --yes || true
            done
            gh release edit "$TAG" --title "GTAVI Unlock FPS ${TAG}" --notes "$NOTES" $REL_FLAG
            gh release upload "$TAG" src/*.elf --clobber
          else
            gh release create "$TAG" src/*.elf --title "GTAVI Unlock FPS ${TAG}" --notes "$NOTES" $REL_FLAG
          fi

          if [ "$REL_FLAG" = "--latest" ]; then
            ELF_PATH=$(ls src/*.elf | head -n 1)
            ELF_NAME=$(basename "$ELF_PATH")
            SHA256=$(sha256sum "$ELF_PATH" | awk '{print $1}')
            DL_URL=$(gh release view "$TAG" --json assets -q '.assets[0].url')
            TODAY=$(date -u +%Y-%m-%d)
            python3 - "$TAG" "$ELF_NAME" "$DL_URL" "$SHA256" "$TODAY" << 'PYEOF'
          import json, sys
          tag, fname, url, sha, today = sys.argv[1:6]
          with open("repo.json", "r") as f:
              data = json.load(f)
          p = data["payloads"][0]
          p["version"] = tag
          p["filename"] = fname
          p["url"] = url
          p["checksum"] = sha
          p["last_update"] = today
          with open("repo.json", "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PYEOF
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if ! git diff --quiet repo.json; then
              git add repo.json
              git commit -m "chore: update repo.json for ${TAG} [skip ci]"
              git push origin HEAD:main
            fi
          fi

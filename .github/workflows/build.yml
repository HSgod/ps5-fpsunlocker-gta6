name: Build PS5 Payload

on:
  push:
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang/LLVM 18 & PS5 Payload SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18 llvm-18-dev make wget unzip
          wget -q -O /tmp/sdk.zip https://github.com/ps5-payload-dev/sdk/releases/download/v0.43/ps5-payload-sdk.zip
          sudo unzip -q -d /opt /tmp/sdk.zip

      - name: Build ELF payload
        env:
          LLVM_CONFIG: /usr/bin/llvm-config-18
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
        run: |
          cd src
          make

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTAVI-UnlockFPS-Payload
          path: src/*.elf

      - name: Publish raw ELF to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(sed -n 's/^#define TOOL_VERSION "\(.*\)"/\1/p' src/gtavi-unlockfps.c)
          TAG="v${VER}"
          SUBJ=$(git log -1 --pretty=%s)
          NOTES=$(git log -1 --pretty=%b)
          if [ -z "$NOTES" ]; then
            NOTES="$SUBJ"
          fi
          REL_FLAG="--latest"
          if echo "$SUBJ" | grep -qi '\[prerelease\]'; then
            REL_FLAG="--prerelease"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            for asset in $(gh release view "$TAG" --json assets -q '.assets[].name'); do
              gh release delete-asset "$TAG" "$asset" --yes || true
            done
            gh release edit "$TAG" --title "GTAVI Unlock FPS ${TAG}" --notes "$NOTES" $REL_FLAG
            gh release upload "$TAG" src/*.elf --clobber
          else
            gh release create "$TAG" src/*.elf --title "GTAVI Unlock FPS ${TAG}" --notes "$NOTES" $REL_FLAG
          fi
